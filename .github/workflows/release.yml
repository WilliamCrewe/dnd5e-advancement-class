name: Release

on:
  push:
    tags:
      - "v*"

env:
  MODULE_ID: advancement-classes

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Compile compendium packs
        run: npx -y @foundryvtt/foundryvtt-cli package pack ${{ env.MODULE_ID }} --in packs/_source/${{ env.MODULE_ID }} --out packs

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${VERSION}\"/" module.json
          sed -i "s|\"download\": *\"[^\"]*\"|\"download\": \"https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/module.zip\"|" module.json
          sed -i "s|\"manifest\": *\"[^\"]*\"|\"manifest\": \"https://github.com/${{ github.repository }}/releases/latest/download/module.json\"|" module.json
          sed -i "s|\"url\": *\"[^\"]*\"|\"url\": \"https://github.com/${{ github.repository }}\"|" module.json

      - name: Build module zip
        run: |
          zip -r module.zip \
            module.json \
            lang \
            scripts \
            styles \
            templates \
            packs/${{ env.MODULE_ID }} \
            README.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json
          generate_release_notes: true
